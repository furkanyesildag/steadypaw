<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Steadypaw</title>
<meta name="description" content="The calm way to track seizures, medications and glucose for your pet.">
<style>
  :root { --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --muted: #6c6c70; --brand: #14857a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --muted: #a1a1a6; --brand: #4fd1bd; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 72px 16px; text-align: center; }
  .mark { width: 96px; height: 96px; margin: 0 auto; border-radius: 22px; background: linear-gradient(135deg, #34c9b4, #0b5e57); display: grid; place-items: center; font-size: 52px; color: #fff; box-shadow: 0 16px 32px rgba(20,133,122,.3); }
  h1 { font-size: 40px; letter-spacing: -0.02em; margin: 24px 0 8px; }
  p { color: var(--muted); font-size: 19px; margin: 0 auto; max-width: 480px; }
  nav { margin-top: 40px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a { color: var(--brand); text-decoration: none; background: var(--card); padding: 12px 20px; border-radius: 999px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img class="mark" src="icon.png" alt="" aria-hidden="true">
  <h1>Steadypaw</h1>
  <p>The calm way to track seizures, medications and glucose for your pet.</p>
  <p lang="tr" style="margin-top:8px;font-size:16px">Evcil hayvanının nöbetlerini, ilaçlarını ve glukozunu sakin bir şekilde takip et.</p>
  <nav>
    <a href="support.html">Support · Destek</a>
    <a href="privacy.html">Privacy · Gizlilik</a>
  </nav>
</main>
</body>
</html>
